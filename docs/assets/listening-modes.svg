<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" fill="none">
  <rect width="1440" height="860" fill="#F2F4F0"/><text x="80" y="105" fill="#193127" font-family="Georgia, serif" font-size="52">从“听见”到“听懂”</text><text x="82" y="146" fill="#718078" font-family="Arial" font-size="20">为输入型学习者设计的盲听与反应训练流程</text>
  <rect x="80" y="216" width="390" height="490" rx="12" fill="#FBFCF9" stroke="#D8DFD9"/><text x="116" y="270" fill="#5E9270" font-family="Arial" font-size="14" font-weight="700" letter-spacing="2">01 · BLIND LISTENING</text><text x="116" y="331" fill="#193127" font-family="Georgia, serif" font-size="34">听写模式</text><text x="116" y="374" fill="#718078" font-family="Arial" font-size="17">先反复听，再写下你听到的英文。</text><rect x="116" y="420" width="318" height="123" rx="8" fill="#EEF2ED"/><text x="142" y="468" fill="#193127" font-family="Arial" font-size="20">Type what you hear…</text><line x1="142" y1="496" x2="379" y2="496" stroke="#9BAAA0" stroke-width="2"/><rect x="116" y="582" width="150" height="46" rx="7" fill="#3E7656"/><text x="148" y="611" fill="#fff" font-family="Arial" font-size="16" font-weight="700">揭晓对照</text>
  <rect x="525" y="216" width="390" height="490" rx="12" fill="#0D171D"/><text x="561" y="270" fill="#A7C984" font-family="Arial" font-size="14" font-weight="700" letter-spacing="2">02 · GUIDED LISTENING</text><text x="561" y="331" fill="#F2EFE6" font-family="Georgia, serif" font-size="34">逐层揭晓</text><text x="561" y="374" fill="#8C9A94" font-family="Arial" font-size="17">首词 → 关键词 → 完整句 → 中文。</text><rect x="561" y="420" width="318" height="123" rx="8" fill="#16262A"/><text x="589" y="467" fill="#A7C984" font-family="Arial" font-size="17">关键词提示</text><text x="589" y="505" fill="#F2EFE6" font-family="Arial" font-size="22">human · voice · instrument</text><rect x="561" y="582" width="164" height="46" rx="7" fill="#87B86C"/><text x="592" y="611" fill="#071116" font-family="Arial" font-size="16" font-weight="700">揭晓完整英文</text>
  <rect x="970" y="216" width="390" height="490" rx="12" fill="#FBFCF9" stroke="#D8DFD9"/><text x="1006" y="270" fill="#5E9270" font-family="Arial" font-size="14" font-weight="700" letter-spacing="2">03 · SPEAK &amp; COMPARE</text><text x="1006" y="331" fill="#193127" font-family="Georgia, serif" font-size="34">模仿与回听</text><text x="1006" y="374" fill="#718078" font-family="Arial" font-size="17">原声 → 我的录音，直接对照节奏。</text><path d="M1042 485h45l30-30v90l-30-30h-45z" fill="#5E9270"/><path d="M1165 470c28 15 28 45 0 60" stroke="#5E9270" stroke-width="7" stroke-linecap="round"/><path d="M1200 450c47 26 47 74 0 100" stroke="#A7C984" stroke-width="7" stroke-linecap="round"/><rect x="1006" y="582" width="290" height="46" rx="7" fill="#E1EEE4"/><text x="1058" y="611" fill="#3E7656" font-family="Arial" font-size="16" font-weight="700">原声 → 我的录音</text>
</svg>

